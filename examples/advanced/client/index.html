<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Micdrop advanced demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Ctext y='50%25' x='50%25' text-anchor='middle' dominant-baseline='central' font-size='56'%3E🎤%3C/text%3E%3C/svg%3E"
    />
    <!--
      Restore the theme before the first paint, on the rule the site follows:
      dark unless the visitor asked for light, and the OS preference is left
      out of it so the docs and the demo look the same to everyone.
    -->
    <script>
      const stored = localStorage.getItem('theme')
      document.documentElement.dataset.theme =
        stored === 'light' ? 'light' : 'dark'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
