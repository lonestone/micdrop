<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micdrop dictation example</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #14161a;
        --muted: #7a8290;
        --line: #d9dde3;
        --paper: #ffffff;
        --ground: #f4f5f7;
        --accent: #2f6df6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2f4f7;
          --muted: #8d95a3;
          --line: #2b3038;
          --paper: #171a1f;
          --ground: #0e1013;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        padding: 2vh 1.5rem 6vh;
        background: var(--ground);
        color: var(--ink);
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      #mic {
        width: 8rem;
        height: 8rem;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: var(--paper);
        color: inherit;
        font-size: 3rem;
        line-height: 1;
        cursor: pointer;
        transition:
          transform 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }
      #mic:hover {
        transform: scale(1.04);
      }
      #mic.recording {
        border-color: var(--accent);
        box-shadow: 0 0 0 0.6rem rgba(47, 109, 246, 0.14);
      }
      #top {
        width: min(52rem, 100%);
        display: flex;
        justify-content: flex-end;
      }
      #status {
        margin: 0;
        color: var(--muted);
        font-size: 1.1rem;
      }
      #language {
        padding: 0.4rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #language:hover {
        border-color: var(--accent);
      }
      #language:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #sheet {
        width: min(52rem, 100%);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      #transcript {
        width: 100%;
        min-height: 40vh;
        padding: 2rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: var(--paper);
        color: inherit;
        font:
          1.6rem/1.6 Georgia,
          serif;
        resize: vertical;
      }
      #transcript:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #copy {
        align-self: flex-end;
        padding: 0.5rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: var(--paper);
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header id="top">
      <select id="language" aria-label="Dictation language"></select>
    </header>
    <button id="mic" aria-label="Start dictation">🎤</button>
    <p id="status">Press the microphone and dictate</p>
    <div id="sheet">
      <textarea
        id="transcript"
        aria-label="Dictated text"
      ></textarea>
      <button id="copy">Copy</button>
    </div>
    <script type="module" src="/src/client.ts"></script>
  </body>
</html>
